# ISO/IEC 27001:2022 Annex A control registry — 93 controls across 4 themes.
# Titles are the standard's published clause titles (short reference), not the full
# control text — verify wording against your licensed copy of the standard before
# using this file as formal audit evidence.
#
# Each control maps to one or more check_ids (see ../checks/registry.yaml). Multiple
# controls commonly share a check — one Supabase/code/pentest scan can close several
# controls at once. `applicability` flags controls that are largely inherited from an
# infra/SaaS subprocessor (Fly/Vercel/Supabase/GCP) rather than something this repo's
# own code can satisfy directly.
#
# scope: per-tool audit. Org-wide programs (policy docs, HR screening, physical
# security of data centers) are assumed to already exist at the company level — the
# checks tagged `org.*` below just confirm THIS system is actually covered by them,
# not that the program itself exists.

